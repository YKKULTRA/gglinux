# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Only master/main, pull requests and manual runs: Actions minutes on a private repo are
# limited, so pushes to work branches do not run CI.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt-get update
          # libudev for the daemon; fontconfig for the app's fonts.
          # Wayland, EGL and xkbcommon are loaded at run time, so the build doesn't need them.
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libfontconfig-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked
