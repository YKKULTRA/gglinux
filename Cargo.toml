[workspace]
resolver = "2"
members = ["crates/gg-ipc", "crates/gg-hid", "crates/gg-device-mouse", "crates/gg-device-headset", "crates/gg-device-keyboard", "crates/gg-gamesense", "crates/gg-audio", "crates/gglinuxd"]
exclude = ["ui"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ykk/gglinux"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
hidapi = "2"
udev = "0.9"
libc = "0.2"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rustfft = "6"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"

# Slimmer, faster debug builds for the C-heavy hidapi dep.
[profile.dev.package."*"]
opt-level = 1
