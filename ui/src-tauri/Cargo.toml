[package]
name = "gglinux-ui"
description = "gglinux desktop UI"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ykk/gglinux"
rust-version = "1.85"

# Deliberately outside the root cargo workspace (see the root `exclude`): Tauri pulls
# in a large, platform-specific dependency tree that would slow every daemon build.

[[bin]]
name = "gglinux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gg-ipc = { path = "../../crates/gg-ipc" }
tauri = { version = "2", features = ["tray-icon"] }
# 2.5 needs tauri 2.12, and the Tauri CLI refuses to build when the tauri crate and
# @tauri-apps/api (2.11) are a minor version apart; move this with them.
tauri-plugin-single-instance = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
